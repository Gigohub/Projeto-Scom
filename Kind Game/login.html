<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Kind Game</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/api.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="pagina pagina--estreita">
    <div class="cartao">
      <h1>Conecte-se ao Kind Game</h1>
      <p id="mensagem" role="alert" hidden></p>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" autocomplete="username" required maxlength="120">
          <p class="campo__erro" data-erro-de="email"></p>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required maxlength="72">
          <p class="campo__erro" data-erro-de="senha"></p>
        </div>
        <button type="submit" class="botao botao--cheio">Entrar</button>
      </form>

      <p class="rodape-form">Ainda não tem conta? <a href="register.html">Criar conta</a></p>
      <p class="rodape-form"><a href="homepage.html">← Voltar para o início</a></p>
    </div>
  </main>
</body>
</html>
